<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home — Victor Davalos, Senior Graphic Designer</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/victor-favicon.svg" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <link rel="stylesheet" href="/src/fonts/general-sans.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      xintegrity="sha512-..."

    />

  <body>
    <div id="header"></div>

    <main>
      <section class="mb-4">
        <div class="container splash-content">
          <p class="eyebrow">Hi, I'm Victor.</p>
          <h1 class="mb-3">
            I'm a
            <span class="accent-color">Senior Graphic Designer</span>
            creating thoughtful print, digital, and event experiences.

          <a href="/work/" class="splash-button">View Work</a>
        </div>
      </section>

      <section class="container mb-4">
        <h2 class="mb-2">Featured Projects</h2>

        <div class="projects-grid">
          <a href="/projects/futures-so-bright/" class="project-card">
            <img
              src="/projects/futures-so-bright/images/TCCF_FutureSoBright_Thumbnail.png"
              alt="Future's So Bright Event Design"
              width="1920"
              height="1080"
              loading="lazy"
            />
            <div class="project-info">
              <h3>Future's So Bright</h3>
              <p>Event Design</p>
            </div>
          </a>

          <a href="sga-design-group.html" class="project-card">
            <img
              src="src/assets/SGA-design-group/sga thumbnail.png"
              alt="SGA Design Group Brand Design"
              width="1920"
              height="1080"
              loading="lazy"
            />
            <div class="project-info">
              <h3>SGA Design Group</h3>
              <p>Brand Design</p>
            </div>
          </a>
        </div>
      </section>

    <div id="footer"></div>
    <script type="module" src="/src/main.js"></script>
